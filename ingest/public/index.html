<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radio Channels</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
  body{font:16px system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;color:#222}
  .ch{border:1px solid #ddd;border-radius:8px;padding:12px 16px;margin:12px 0}
  .live{color:#c00;font-weight:600}
  audio{width:100%;margin:4px 0}
  code{font-size:13px;word-break:break-all;background:#f4f4f4;padding:1px 4px}
  small{color:#666}
</style>
<h1>📻 Radio Channels</h1>
<p><a href="/broadcast">🎙️ Go to broadcaster page</a></p>
<div id="list"></div>
<script>
const players = {};
async function load() {
  const list = await (await fetch('/api/channels')).json();
  const root = document.getElementById('list');
  for (const c of list) {
    let el = document.getElementById('ch-' + c.name);
    if (!el) {
      const hlsUrl = new URL(c.hls, location.href).href;
      el = document.createElement('div');
      el.className = 'ch'; el.id = 'ch-' + c.name;
      el.innerHTML = `
        <h3>${c.name} <span class="st"></span></h3>
        <small>MP3 (Icecast)</small> <code>${c.mp3}</code>
        <audio controls preload="none" src="${c.mp3}"></audio>
        <small>HLS (CDN)</small> <code>${hlsUrl}</code>
        <audio controls preload="none" class="hls"></audio>`;
      root.appendChild(el);
      const a = el.querySelector('.hls');
      if (a.canPlayType('application/vnd.apple.mpegurl')) a.src = hlsUrl;
      else if (window.Hls && Hls.isSupported()) { const h = new Hls(); h.loadSource(hlsUrl); h.attachMedia(a); }
    }
    el.querySelector('.st').innerHTML = c.live ? '<span class="live">● LIVE</span>' : '<small>(silence — no broadcaster)</small>';
  }
}
load(); setInterval(load, 3000);
</script>
</html>
